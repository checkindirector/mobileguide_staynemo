<svg lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="t d"><title id="t">2口IHの使い方</title><desc id="d">調理器具・電源・火力・停止</desc><rect width="720" height="900" fill="#f4f0e8"/><text x="56" y="76" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="18" letter-spacing="3" fill="#6d4a34">2口IHクッキングヒーター</text><text x="56" y="132" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#26231f">安全に調理するために</text><rect x="110" y="210" width="500" height="330" rx="28" fill="#26231f"/><circle cx="360" cy="330" r="98" fill="none" stroke="#b08a4a" stroke-width="4"/><circle cx="360" cy="330" r="66" fill="none" stroke="#5a5754" stroke-width="3"/><path d="M290 278h140l-18-55H308z" fill="#42413e" stroke="#fff" stroke-width="5"/><path d="M320 220h80" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="276" cy="486" r="23" fill="#6d4a34"/><path d="M264 486h24" stroke="#fff" stroke-width="5"/><circle cx="360" cy="486" r="23" fill="#b08a4a"/><path d="M350 486h20M360 476v20" stroke="#fff" stroke-width="5"/><circle cx="444" cy="486" r="23" fill="#42413e" stroke="#fff" stroke-width="2"/><path d="M444 473v19" stroke="#fff" stroke-width="5"/><path d="M433 482a15 15 0 1 0 22 0" fill="none" stroke="#fff" stroke-width="5"/><g font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" fill="#26231f"><text x="72" y="620" font-size="18" fill="#6d4a34">01</text><text x="122" y="620" font-size="24" font-weight="700">IH対応の鍋を中央に置きます。</text><line x1="72" y1="650" x2="648" y2="650" stroke="#d4c8b8"/><text x="72" y="706" font-size="18" fill="#6d4a34">02</text><text x="122" y="706" font-size="24" font-weight="700">電源 → 使用する口 → ＋／−で調節。</text><line x1="72" y1="736" x2="648" y2="736" stroke="#d4c8b8"/><text x="72" y="792" font-size="18" fill="#6d4a34">03</text><text x="122" y="792" font-size="24" font-weight="700">使用後は電源を切り、余熱に注意。</text></g><text x="56" y="850" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="16" letter-spacing="2" fill="#857c72">STAY NEMO · 簡単ガイド</text></svg>
