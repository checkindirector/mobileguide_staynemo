<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200">
  <rect width="960" height="1200" fill="#f5f0e8"/><text x="72" y="86" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#8a6734" letter-spacing="3">SAMSUNG SMART TV</text><text x="72" y="142" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#292621">Remote control guide</text><text x="72" y="184" font-family="Arial,sans-serif" font-size="20" fill="#6f6961">KU43F6050FFXKR · based on the in-room remote</text>
  <rect x="92" y="236" width="300" height="820" rx="68" fill="#292621"/><circle cx="160" cy="310" r="28" fill="#b38a4b"/><path d="M160 294v20m-12-14a20 20 0 1 0 24 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="210" y="318" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">POWER</text><rect x="132" y="382" width="220" height="76" rx="18" fill="#3b3833"/><text x="242" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">HOME</text><circle cx="242" cy="566" r="106" fill="#3b3833" stroke="#b38a4b" stroke-width="5"/><circle cx="242" cy="566" r="43" fill="#b38a4b"/><text x="242" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">SELECT</text><path d="M242 472l-15 22h30zM242 660l-15-22h30zM148 566l22-15v30zM336 566l-22-15v30z" fill="#fff"/><rect x="126" y="704" width="108" height="66" rx="16" fill="#3b3833"/><path d="M197 736h-34m0 0 16-15m-16 15 16 15" fill="none" stroke="#fff" stroke-width="5"/><rect x="250" y="704" width="108" height="66" rx="16" fill="#3b3833"/><path d="M280 747h48l-24-22z" fill="none" stroke="#fff" stroke-width="4"/><text x="242" y="1000" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ddd7ce">Button shapes may vary slightly.</text>
  <g font-family="Arial,sans-serif" fill="#292621"><text x="446" y="304" font-size="25" font-weight="800">1  TURN ON</text><text x="446" y="338" font-size="18" fill="#6f6961">Press Power once.</text><text x="446" y="430" font-size="25" font-weight="800">2  OPEN AN APP</text><text x="446" y="464" font-size="18" fill="#6f6961">HOME → arrows → Select.</text><text x="446" y="556" font-size="25" font-weight="800">3  EXIT PLAYBACK</text><text x="446" y="590" font-size="18" fill="#6f6961">Back steps out; HOME leaves the app.</text><text x="446" y="682" font-size="25" font-weight="800">4  SIGN OUT</text><text x="446" y="716" font-size="18" fill="#6f6961">Use Profile or Settings inside each app.</text><text x="446" y="808" font-size="25" font-weight="800">5  TURN OFF</text><text x="446" y="842" font-size="18" fill="#6f6961">Press Power once.</text></g>
  <rect x="446" y="900" width="430" height="156" rx="18" fill="#e8dcc9"/><text x="478" y="944" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#704f2c">BEFORE CHECK-OUT</text><text x="478" y="982" font-family="Arial,sans-serif" font-size="18" fill="#594f45">Sign out of every streaming app you used.</text><text x="478" y="1014" font-family="Arial,sans-serif" font-size="18" fill="#594f45">Turning the TV off does not remove</text><text x="478" y="1046" font-family="Arial,sans-serif" font-size="18" fill="#594f45">your account information.</text>
</svg>
