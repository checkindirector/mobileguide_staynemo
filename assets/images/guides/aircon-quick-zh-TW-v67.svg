<svg xmlns="http://www.w3.org/2000/svg" lang="zh-TW" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">冷氣快速使用指南</title><rect width="720" height="1260" fill="#f4f0e8"/><g font-family="Arial,Microsoft JhengHei,Microsoft YaHei,Meiryo,sans-serif"><text x="44" y="48" font-size="17" fill="#6d4a34" letter-spacing="1">STAY NEMO · 住客指南</text><text x="44" y="101" font-size="34" font-weight="700" fill="#26231f">冷氣快速使用指南</text><g transform="translate(46 123) scale(.62)" fill="none" stroke="#6d4a34" stroke-width="6" stroke-linecap="round"><rect x="15" y="42" width="170" height="114" rx="12"/><rect x="35" y="59" width="130" height="52" rx="5"/><path d="M53 133h18m63 0h18m-9-9v18"/></g><text x="196" y="181" font-size="23" font-weight="700" fill="#26231f">Samsung</text><text x="196" y="218" font-size="20" fill="#42413e"><tspan x="196" dy="0">公共區 · 臥室1 · 臥室2</tspan></text><rect x="34" y="266" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="297" r="20" fill="#6d4a34"/><text x="70" y="304" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="104" y="304" font-size="25" fill="#26231f" font-weight="700">開啟電源</text><text x="104" y="342" font-size="26" fill="#42413e"><tspan x="104" dy="0">按下牆面控制器電源鍵。</tspan></text><rect x="34" y="442" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="473" r="20" fill="#6d4a34"/><text x="70" y="480" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="104" y="480" font-size="25" fill="#26231f" font-weight="700">選擇模式</text><text x="104" y="518" font-size="26" fill="#42413e"><tspan x="104" dy="0">在運行模式中選擇冷房或暖房。</tspan></text><rect x="34" y="618" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="649" r="20" fill="#6d4a34"/><text x="70" y="656" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="104" y="656" font-size="25" fill="#26231f" font-weight="700">溫度與風量</text><text x="104" y="694" font-size="26" fill="#42413e"><tspan x="104" dy="0">用上下鍵設定溫度，並按需調節風量。</tspan></text><rect x="34" y="794" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="825" r="20" fill="#6d4a34"/><text x="70" y="832" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><text x="104" y="832" font-size="25" fill="#26231f" font-weight="700">外出或退房前</text><text x="104" y="870" font-size="26" fill="#42413e"><tspan x="104" dy="0">外出或退房時請關閉電源。</tspan></text><rect x="34" y="1024" width="652" height="168" rx="14" fill="#e6dccb"/><text x="54" y="1060" font-size="20" font-weight="700" fill="#6d4a34">注意事項</text><text x="54" y="1100" font-size="24" fill="#42413e"><tspan x="54" dy="0">中央控制時部分模式可能受限。無法操作時請聯繫房東。</tspan></text><text x="44" y="1232" font-size="16" fill="#746d65">住客使用摘要 · 官方資料請見頁面下方連結</text></g></svg>