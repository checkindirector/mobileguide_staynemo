<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">Washer-dryer quick guide</title><rect width="720" height="1260" fill="#f4f0e8"/><g font-family="Arial,Microsoft JhengHei,Microsoft YaHei,Meiryo,sans-serif"><text x="44" y="48" font-size="17" fill="#6d4a34" letter-spacing="1">STAY NEMO · GUEST GUIDE</text><text x="44" y="101" font-size="34" font-weight="700" fill="#26231f">Washer-dryer quick guide</text><g transform="translate(46 123) scale(.62)" fill="none" stroke="#6d4a34" stroke-width="6" stroke-linecap="round"><rect x="38" y="25" width="124" height="145" rx="12"/><circle cx="100" cy="111" r="39"/><path d="M52 52h50m25 0h13"/></g><text x="196" y="181" font-size="23" font-weight="700" fill="#26231f">LG FY9WTB</text><text x="196" y="218" font-size="20" fill="#42413e"><tspan x="196" dy="0">Wash 9kg · dry 4.5kg</tspan></text><rect x="34" y="266" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="297" r="20" fill="#6d4a34"/><text x="70" y="304" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="104" y="304" font-size="25" fill="#26231f" font-weight="700">Prepare</text><text x="104" y="342" font-size="26" fill="#42413e"><tspan x="104" dy="0">Load laundry, close the door, and add</tspan><tspan x="104" dy="39">detergent and softener.</tspan></text><rect x="34" y="442" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="473" r="20" fill="#6d4a34"/><text x="70" y="480" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="104" y="480" font-size="25" fill="#26231f" font-weight="700">Power &amp; mode</text><text x="104" y="518" font-size="26" fill="#42413e"><tspan x="104" dy="0">Press Power and choose the correct cycle.</tspan></text><rect x="34" y="618" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="649" r="20" fill="#6d4a34"/><text x="70" y="656" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="104" y="656" font-size="25" fill="#26231f" font-weight="700">Adjust &amp; start</text><text x="104" y="694" font-size="26" fill="#42413e"><tspan x="104" dy="0">Adjust rinse, spin, or temperature if</tspan><tspan x="104" dy="39">needed, then hold Start/Pause for one</tspan><tspan x="104" dy="39">second.</tspan></text><rect x="34" y="794" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="825" r="20" fill="#6d4a34"/><text x="70" y="832" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><text x="104" y="832" font-size="25" fill="#26231f" font-weight="700">After use</text><text x="104" y="870" font-size="26" fill="#42413e"><tspan x="104" dy="0">Remove laundry promptly and leave the door</tspan><tspan x="104" dy="39">and detergent drawer open.</tspan></text><rect x="34" y="1024" width="652" height="168" rx="14" fill="#e6dccb"/><text x="54" y="1060" font-size="20" font-weight="700" fill="#6d4a34">IMPORTANT</text><text x="54" y="1100" font-size="24" fill="#42413e"><tspan x="54" dy="0">The drum and laundry may be hot after drying.</tspan><tspan x="54" dy="36">Handle with care.</tspan></text><text x="44" y="1232" font-size="16" fill="#746d65">Guest-use summary · See the official source below</text></g></svg>