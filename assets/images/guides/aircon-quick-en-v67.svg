<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">Air-conditioner quick guide</title><rect width="720" height="1260" fill="#f4f0e8"/><g font-family="Arial,Microsoft JhengHei,Microsoft YaHei,Meiryo,sans-serif"><text x="44" y="48" font-size="17" fill="#6d4a34" letter-spacing="1">STAY NEMO · GUEST GUIDE</text><text x="44" y="101" font-size="34" font-weight="700" fill="#26231f">Air-conditioner quick guide</text><g transform="translate(46 123) scale(.62)" fill="none" stroke="#6d4a34" stroke-width="6" stroke-linecap="round"><rect x="15" y="42" width="170" height="114" rx="12"/><rect x="35" y="59" width="130" height="52" rx="5"/><path d="M53 133h18m63 0h18m-9-9v18"/></g><text x="196" y="181" font-size="23" font-weight="700" fill="#26231f">Samsung</text><text x="196" y="218" font-size="20" fill="#42413e"><tspan x="196" dy="0">Living area · Bedroom 1 · Bedroom 2</tspan></text><rect x="34" y="266" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="297" r="20" fill="#6d4a34"/><text x="70" y="304" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="104" y="304" font-size="25" fill="#26231f" font-weight="700">Power on</text><text x="104" y="342" font-size="26" fill="#42413e"><tspan x="104" dy="0">Press Power on the wall controller.</tspan></text><rect x="34" y="442" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="473" r="20" fill="#6d4a34"/><text x="70" y="480" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="104" y="480" font-size="25" fill="#26231f" font-weight="700">Select a mode</text><text x="104" y="518" font-size="26" fill="#42413e"><tspan x="104" dy="0">Choose Cool or Heat from Operation Mode.</tspan></text><rect x="34" y="618" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="649" r="20" fill="#6d4a34"/><text x="70" y="656" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="104" y="656" font-size="25" fill="#26231f" font-weight="700">Temperature &amp; fan</text><text x="104" y="694" font-size="26" fill="#42413e"><tspan x="104" dy="0">Set the temperature with the up/down</tspan><tspan x="104" dy="39">controls and adjust fan speed if needed.</tspan></text><rect x="34" y="794" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="825" r="20" fill="#6d4a34"/><text x="70" y="832" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><text x="104" y="832" font-size="25" fill="#26231f" font-weight="700">Before leaving</text><text x="104" y="870" font-size="26" fill="#42413e"><tspan x="104" dy="0">Turn the unit off when leaving.</tspan></text><rect x="34" y="1024" width="652" height="168" rx="14" fill="#e6dccb"/><text x="54" y="1060" font-size="20" font-weight="700" fill="#6d4a34">IMPORTANT</text><text x="54" y="1100" font-size="24" fill="#42413e"><tspan x="54" dy="0">Some modes may be limited by central control.</tspan><tspan x="54" dy="36">Message the host if the unit does not respond.</tspan></text><text x="44" y="1232" font-size="16" fill="#746d65">Guest-use summary · See the official source below</text></g></svg>