<svg xmlns="http://www.w3.org/2000/svg" lang="ja" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">洗濯乾燥機の使い方</title><rect width="720" height="1260" fill="#f4f0e8"/><g font-family="Arial,Microsoft JhengHei,Microsoft YaHei,Meiryo,sans-serif"><text x="44" y="48" font-size="17" fill="#6d4a34" letter-spacing="1">STAY NEMO · ご利用ガイド</text><text x="44" y="101" font-size="34" font-weight="700" fill="#26231f">洗濯乾燥機の使い方</text><g transform="translate(46 123) scale(.62)" fill="none" stroke="#6d4a34" stroke-width="6" stroke-linecap="round"><rect x="38" y="25" width="124" height="145" rx="12"/><circle cx="100" cy="111" r="39"/><path d="M52 52h50m25 0h13"/></g><text x="196" y="181" font-size="23" font-weight="700" fill="#26231f">LG FY9WTB</text><text x="196" y="218" font-size="20" fill="#42413e"><tspan x="196" dy="0">洗濯9kg・乾燥4.5kg</tspan></text><rect x="34" y="266" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="297" r="20" fill="#6d4a34"/><text x="70" y="304" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="104" y="304" font-size="25" fill="#26231f" font-weight="700">洗濯物と洗剤</text><text x="104" y="342" font-size="26" fill="#42413e"><tspan x="104" dy="0">洗濯物を入れて扉を閉め、洗剤と柔軟剤を入れま</tspan><tspan x="104" dy="39">す。</tspan></text><rect x="34" y="442" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="473" r="20" fill="#6d4a34"/><text x="70" y="480" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="104" y="480" font-size="25" fill="#26231f" font-weight="700">電源とコース</text><text x="104" y="518" font-size="26" fill="#42413e"><tspan x="104" dy="0">電源を入れ、適切なコースを選びます。</tspan></text><rect x="34" y="618" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="649" r="20" fill="#6d4a34"/><text x="70" y="656" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="104" y="656" font-size="25" fill="#26231f" font-weight="700">調整してスタート</text><text x="104" y="694" font-size="26" fill="#42413e"><tspan x="104" dy="0">必要に応じてすすぎ・脱水・水温を調整し、スタ</tspan><tspan x="104" dy="39">ートを1秒押します。</tspan></text><rect x="34" y="794" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="825" r="20" fill="#6d4a34"/><text x="70" y="832" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><text x="104" y="832" font-size="25" fill="#26231f" font-weight="700">使用後の片づけ</text><text x="104" y="870" font-size="26" fill="#42413e"><tspan x="104" dy="0">終了後はすぐ取り出し、扉と洗剤投入口を開けて</tspan><tspan x="104" dy="39">おきます。</tspan></text><rect x="34" y="1024" width="652" height="168" rx="14" fill="#e6dccb"/><text x="54" y="1060" font-size="20" font-weight="700" fill="#6d4a34">ご注意</text><text x="54" y="1100" font-size="24" fill="#42413e"><tspan x="54" dy="0">乾燥直後は内部と衣類が熱い場合があります。やけど</tspan><tspan x="54" dy="36">にご注意ください。</tspan></text><text x="44" y="1232" font-size="16" fill="#746d65">宿泊者向け要約 · 公式資料はページ下部のリンクへ</text></g></svg>