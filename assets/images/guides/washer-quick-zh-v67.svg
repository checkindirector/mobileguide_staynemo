<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" viewBox="0 0 720 1260" role="img" aria-labelledby="title"><title id="title">洗烘一体机使用指南</title><rect width="720" height="1260" fill="#f4f0e8"/><g font-family="Arial,Microsoft JhengHei,Microsoft YaHei,Meiryo,sans-serif"><text x="44" y="48" font-size="17" fill="#6d4a34" letter-spacing="1">STAY NEMO · 住客指南</text><text x="44" y="101" font-size="34" font-weight="700" fill="#26231f">洗烘一体机使用指南</text><g transform="translate(46 123) scale(.62)" fill="none" stroke="#6d4a34" stroke-width="6" stroke-linecap="round"><rect x="38" y="25" width="124" height="145" rx="12"/><circle cx="100" cy="111" r="39"/><path d="M52 52h50m25 0h13"/></g><text x="196" y="181" font-size="23" font-weight="700" fill="#26231f">LG FY9WTB</text><text x="196" y="218" font-size="20" fill="#42413e"><tspan x="196" dy="0">洗涤9kg · 烘干4.5kg</tspan></text><rect x="34" y="266" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="297" r="20" fill="#6d4a34"/><text x="70" y="304" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><text x="104" y="304" font-size="25" fill="#26231f" font-weight="700">衣物与洗涤剂</text><text x="104" y="342" font-size="26" fill="#42413e"><tspan x="104" dy="0">放入衣物并关好机门，加入洗涤剂和柔顺剂。</tspan></text><rect x="34" y="442" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="473" r="20" fill="#6d4a34"/><text x="70" y="480" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><text x="104" y="480" font-size="25" fill="#26231f" font-weight="700">电源与程序</text><text x="104" y="518" font-size="26" fill="#42413e"><tspan x="104" dy="0">打开电源并选择合适程序。</tspan></text><rect x="34" y="618" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="649" r="20" fill="#6d4a34"/><text x="70" y="656" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><text x="104" y="656" font-size="25" fill="#26231f" font-weight="700">调节并启动</text><text x="104" y="694" font-size="26" fill="#42413e"><tspan x="104" dy="0">按需调整漂洗、脱水或水温，再长按启动/暂停1秒。</tspan></text><rect x="34" y="794" width="652" height="168" rx="16" fill="#fbf8f2" stroke="#d8cec0"/><circle cx="70" cy="825" r="20" fill="#6d4a34"/><text x="70" y="832" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><text x="104" y="832" font-size="25" fill="#26231f" font-weight="700">使用后整理</text><text x="104" y="870" font-size="26" fill="#42413e"><tspan x="104" dy="0">结束后及时取出衣物，并敞开机门和洗涤剂盒。</tspan></text><rect x="34" y="1024" width="652" height="168" rx="14" fill="#e6dccb"/><text x="54" y="1060" font-size="20" font-weight="700" fill="#6d4a34">注意事项</text><text x="54" y="1100" font-size="24" fill="#42413e"><tspan x="54" dy="0">烘干后内筒和衣物可能很烫，请谨防烫伤。</tspan></text><text x="44" y="1232" font-size="16" fill="#746d65">住客使用摘要 · 官方资料请见页面下方链接</text></g></svg>