<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="t d"><title id="t">电视账号退出指南</title><desc id="d">退房前的隐私保护步骤</desc><rect width="720" height="900" fill="#26231f"/><text x="56" y="76" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="18" letter-spacing="3" fill="#b08a4a">退房之前</text><text x="56" y="132" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#fff">请退出个人账号</text><circle cx="360" cy="350" r="140" fill="#42413e" stroke="#b08a4a" stroke-width="3"/><circle cx="360" cy="310" r="45" fill="none" stroke="#fff" stroke-width="10"/><path d="M267 440c16-64 65-91 93-91s77 27 93 91" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M410 300h112m0 0-30-30m30 30-30 30" fill="none" stroke="#b08a4a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" fill="#fff"><text x="72" y="600" font-size="18" fill="#b08a4a">01</text><text x="122" y="600" font-size="25" font-weight="700">打开各个使用过的应用账号设置。</text><line x1="72" y1="630" x2="648" y2="630" stroke="#55514d"/><text x="72" y="688" font-size="18" fill="#b08a4a">02</text><text x="122" y="688" font-size="25" font-weight="700">选择“退出账号”并确认。</text><line x1="72" y1="718" x2="648" y2="718" stroke="#55514d"/><text x="72" y="776" font-size="18" fill="#b08a4a">03</text><text x="122" y="776" font-size="25" font-weight="700">关闭电视电源。</text></g><text x="56" y="850" font-family="Arial,Microsoft YaHei,Meiryo,sans-serif" font-size="16" letter-spacing="2" fill="#b8b1aa">STAY NEMO · 隐私保护</text></svg>
