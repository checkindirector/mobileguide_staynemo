<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="t d"><title id="t">Haatz hood guide</title><desc id="d">Ventilation while cooking</desc><rect width="720" height="900" fill="#26231f"/><text x="56" y="76" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#b08a4a">HAATZ HOOD</text><text x="56" y="132" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">RUN WHILE COOKING</text><path d="M170 245h380l-58 190H228z" fill="#42413e" stroke="#fff" stroke-width="5"/><path d="M260 455h200" stroke="#b08a4a" stroke-width="12" stroke-linecap="round"/><path d="M280 540c-42 56 42 56 0 112M360 540c-42 56 42 56 0 112M440 540c-42 56 42 56 0 112" fill="none" stroke="#b08a4a" stroke-width="8" stroke-linecap="round"/><g font-family="Arial,sans-serif" fill="#fff"><text x="72" y="708" font-size="18" fill="#b08a4a">01</text><text x="122" y="708" font-size="24" font-weight="700">Turn on the hood and select a fan level.</text><line x1="72" y1="738" x2="648" y2="738" stroke="#55514d"/><text x="72" y="794" font-size="18" fill="#b08a4a">02</text><text x="122" y="794" font-size="24" font-weight="700">Turn it off after odors have cleared.</text></g><text x="56" y="850" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#b8b1aa">STAY NEMO · VENTILATION</text></svg>
